# Detekt configuration for adult-hub-player
# Runs on top of detekt's default rule sets (buildUponDefaultConfig = true):
# potential-bugs, exceptions, coroutines, naming, empty-blocks, style and complexity
# are all active, so the gate checks more than complexity alone. The entries below
# override thresholds and deliberately switch off rules that do not fit the codebase.
# Formatting and layout are delegated to Ktlint.

style:
  ForbiddenMethodCall:
    active: true
    methods:
      - 'kotlin.io.print'
      - 'kotlin.io.println'
  MaxLineLength:
    active: false
  MagicNumber:
    # UI dimensions (dp/tick multipliers, aspect ratios, HTTP status codes) are
    # intentionally inline; the noise outweighs the benefit in this codebase.
    active: false
  WildcardImport:
    # Kept active in detekt's defaults; ktlint standard already enforces import order.
    active: false

naming:
  FunctionNaming:
    # Jetpack Compose composables are PascalCase by convention.
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - 'Composable'

complexity:
  active: true
  ComplexCondition:
    active: true
    allowedConditions: 4
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 20
    ignoreSingleWhenExpression: true
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 20
  LongMethod:
    active: true
    allowedLines: 100
  LongParameterList:
    active: true
    allowedFunctionParameters: 12
    allowedConstructorParameters: 12
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  LargeClass:
    active: true
    allowedLines: 600
  NestedBlockDepth:
    active: true
    allowedDepth: 6
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 30
    allowedFunctionsPerInterface: 30
